worker_processes 1;

events { worker_connections 1024; }

http {
    upstream student { server student:5000; }
    upstream admin   { server admin:5000; }
    upstream driver  { server driver:5000; }

    # HTTP → HTTPS リダイレクト
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # HTTPS サーバー
    server {
        listen 443 ssl http2;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /etc/nginx/html;

        error_page 502 503 504 /maintenance.html;
        location = /maintenance.html {
            root /etc/nginx/html;
            internal;
        }

        location / {
            proxy_pass http://student;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_intercept_errors on;
            error_page 502 503 504 = /maintenance.html;
        }

        location /student/ {
            rewrite ^/student/(.*)$ /$1 break;
            proxy_pass http://student;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_intercept_errors on;
            error_page 502 503 504 = /maintenance.html;
        }

        location /student {
            return 301 $scheme://$host/student/;
        }

        location /admin/ {
            rewrite ^/admin/(.*)$ /$1 break;
            proxy_pass http://admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_intercept_errors on;
            error_page 502 503 504 = /maintenance.html;
        }

        location /admin {
            return 301 $scheme://$host/admin/;
        }

        location /driver/ {
            rewrite ^/driver/(.*)$ /$1 break;
            proxy_pass http://driver;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_intercept_errors on;
            error_page 502 503 504 = /maintenance.html;
        }

        location /driver {
            return 301 $scheme://$host/driver/;
        }
    }
}
