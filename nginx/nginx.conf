worker_processes 1;

events { worker_connections 1024; }

http {
    upstream student { server student:5000; }
    upstream admin   { server admin:5000; }
    upstream driver  { server driver:5000; }

    # HTTP サーバー（開発環境用）
    server {
        listen 80;
        server_name localhost;
        
        # 開発環境では HTTP を許可
        root /etc/nginx/html;

        error_page 502 503 504 /maintenance.html;
        location = /maintenance.html {
            root /etc/nginx/html;
            internal;
        }

        # 管理者サービス用
        location /admin/ {
            rewrite ^/admin/(.*)$ /$1 break;
            proxy_pass http://admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /admin {
            return 301 $scheme://$host/admin/;
        }

        # ドライバーサービス用
        location /driver/ {
            rewrite ^/driver/(.*)$ /$1 break;
            proxy_pass http://driver;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /driver {
            return 301 $scheme://$host/driver/;
        }

        # 学生サービスの特定エンドポイント用（admin-loginなど）
        location /student/admin-login {
            rewrite ^/student/(.*)$ /$1 break;
            proxy_pass http://student;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 学生サービス用（ルートで直接アクセス）- 最後に配置
        location / {
            proxy_pass http://student;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /student {
            return 301 $scheme://$host/;
        }

        location /student/ {
            return 301 $scheme://$host/;
        }
    }

    # HTTPS リダイレクト（本番環境用・コメントアウト）
    # server {
    #     listen 80;
    #     server_name localhost;
    #     return 301 https://$host$request_uri;
    # }

    # HTTPS サーバー
    server {
        listen 443 ssl http2;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /etc/nginx/html;

        error_page 502 503 504 /maintenance.html;
        location = /maintenance.html {
            root /etc/nginx/html;
            internal;
        }

        # 管理者サービス用
        location /admin/ {
            rewrite ^/admin/(.*)$ /$1 break;
            proxy_pass http://admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_intercept_errors on;
            error_page 502 503 504 = /maintenance.html;
        }

        location /admin {
            return 301 $scheme://$host/admin/;
        }

        # ドライバーサービス用
        location /driver/ {
            rewrite ^/driver/(.*)$ /$1 break;
            proxy_pass http://driver;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_intercept_errors on;
            error_page 502 503 504 = /maintenance.html;
        }

        location /driver {
            return 301 $scheme://$host/driver/;
        }

        # 学生サービスの特定エンドポイント用（admin-loginなど）
        location /student/admin-login {
            rewrite ^/student/(.*)$ /$1 break;
            proxy_pass http://student;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_intercept_errors off;
        }

        # 学生サービス用（ルートで直接アクセス）
        location / {
            proxy_pass http://student;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            # 開発環境では500エラーでもmaintenance画面を表示しない
            proxy_intercept_errors off;
        }

        location /student {
            return 301 $scheme://$host/;
        }

        location /student/ {
            return 301 $scheme://$host/;
        }
    }
}
