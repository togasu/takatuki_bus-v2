services:
  nginx:
    image: nginx:latest
    ports:
      - "${NGINX_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/maintenance.html:/etc/nginx/html/maintenance.html:ro
      - ./logs:/app/logs
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - student
      - admin
      - driver
    networks:
      - appnet

  student:
    build: ./student
    volumes:
      - ./logs:/app/logs
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: mydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis
    networks:
      - appnet

  admin:
    build: ./admin
    volumes:
      - ./logs:/app/logs
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: mydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis
    networks:
      - appnet

  driver:
    build: ./driver
    volumes:
      - ./logs:/app/logs
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: mydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis
    networks:
      - appnet

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - appnet

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.240.10.0/24

volumes:
  postgres_data:
  redis_data:
