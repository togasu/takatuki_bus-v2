{% extends "base.html" %}

{% block title %}管理者アカウント作成 - Sojo Bus Admin{% endblock %}

{% block extra_styles %}
<style>
    .form-container {
        max-width: 600px;
        margin: 0 auto;
    }
    .password-strength {
        margin-top: 5px;
        font-size: 0.875rem;
    }
    .strength-weak { color: #dc3545; }
    .strength-medium { color: #fd7e14; }
    .strength-strong { color: #198754; }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
    <h1 class="mb-4">管理者アカウント作成</h1>
    
    <form method="POST" action="/admin/create" id="createAdminForm">
        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="username" class="form-label">ユーザー名 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="username" name="username" 
                           value="{{ username or '' }}" required
                           pattern="[a-zA-Z0-9_]+" 
                           minlength="3"
                           title="3文字以上の英数字とアンダースコアのみ使用できます">
                    <div class="form-text">3文字以上の英数字とアンダースコアのみ</div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="email" class="form-label">メールアドレス <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" id="email" name="email" 
                           value="{{ email or '' }}" required>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="password" class="form-label">パスワード <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="password" name="password" 
                           required minlength="8" autocomplete="new-password">
                    <div id="passwordStrength" class="password-strength"></div>
                    <div class="form-text">8文字以上で入力してください</div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="confirm_password" class="form-label">パスワード確認 <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" 
                           required minlength="8" autocomplete="new-password">
                    <div id="passwordMatch" class="form-text"></div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="role" class="form-label">権限レベル</label>
                    <select class="form-select" id="role" name="role">
                        <option value="admin" {{ 'selected' if role == 'admin' else '' }}>管理者（admin）</option>
                        <option value="normal" {{ 'selected' if role == 'normal' else '' }}>一般（normal）</option>
                        <option value="guest" {{ 'selected' if role == 'guest' else '' }}>ゲスト（guest）</option>
                    </select>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="mb-3">
                    <div class="form-check mt-4">
                        <input class="form-check-input" type="checkbox" id="is_active" name="is_active" 
                               {{ 'checked' if is_active else '' }}>
                        <label class="form-check-label" for="is_active">
                            アカウントを有効化
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
            <a href="/admin" class="btn btn-secondary me-md-2">キャンセル</a>
            <button type="submit" class="btn btn-primary" id="submitBtn">アカウント作成</button>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // パスワード強度チェック
    function checkPasswordStrength(password) {
        let strength = 0;
        let feedback = '';
        
        if (password.length >= 8) strength++;
        if (/[a-z]/.test(password)) strength++;
        if (/[A-Z]/.test(password)) strength++;
        if (/[0-9]/.test(password)) strength++;
        if (/[^A-Za-z0-9]/.test(password)) strength++;
        
        if (strength <= 2) {
            feedback = '<span class="strength-weak">弱い</span>';
        } else if (strength <= 4) {
            feedback = '<span class="strength-medium">中程度</span>';
        } else {
            feedback = '<span class="strength-strong">強い</span>';
        }
        
        return feedback;
    }
    
    // パスワード一致チェック
    function checkPasswordMatch() {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm_password').value;
        const matchDiv = document.getElementById('passwordMatch');
        
        if (confirmPassword === '') {
            matchDiv.innerHTML = '';
            return;
        }
        
        if (password === confirmPassword) {
            matchDiv.innerHTML = '<span class="text-success">パスワードが一致しています</span>';
        } else {
            matchDiv.innerHTML = '<span class="text-danger">パスワードが一致しません</span>';
        }
    }
    
    // イベントリスナー
    document.getElementById('password').addEventListener('input', function() {
        const password = this.value;
        document.getElementById('passwordStrength').innerHTML = 
            password ? `パスワード強度: ${checkPasswordStrength(password)}` : '';
        checkPasswordMatch();
    });
    
    document.getElementById('confirm_password').addEventListener('input', checkPasswordMatch);
    
    // フォーム送信時のバリデーション
    document.getElementById('createAdminForm').addEventListener('submit', function(e) {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm_password').value;
        
        if (password !== confirmPassword) {
            e.preventDefault();
            alert('パスワードが一致しません');
            return;
        }
        
        if (password.length < 8) {
            e.preventDefault();
            alert('パスワードは8文字以上で入力してください');
            return;
        }
        
        // 送信ボタンを無効化して重複送信を防ぐ
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('submitBtn').innerHTML = 
            '<span class="spinner-border spinner-border-sm me-2"></span>作成中...';
    });
    
    // ユーザー名の入力制限
    document.getElementById('username').addEventListener('input', function(e) {
        // 英数字とアンダースコア以外を除去
        this.value = this.value.replace(/[^a-zA-Z0-9_]/g, '');
    });
</script>
{% endblock %}
