<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約確認 - Sojo Bus Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/admin/">Sojo Bus Admin</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/admin/">
                    <i class="fas fa-home"></i> ダッシュボード
                </a>
                <a class="nav-link btn btn-outline-light ms-2" href="/admin/logout">
                    <i class="fas fa-sign-out-alt"></i> ログアウト
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 class="mb-4">予約確認</h1>
        
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">
                            <i class="fas fa-search"></i> 学籍番号で検索
                        </h5>
                        <p class="card-text">学生の学籍番号から予約履歴を検索します</p>
                        <a href="/admin/reservations/search" class="btn btn-primary">検索</a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4 mb-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">
                            <i class="fas fa-bus"></i> 便ごとの予約状況
                        </h5>
                        <p class="card-text">バス便ごとの座席予約状況を確認します</p>
                        <a href="/admin/reservations/bus/list" class="btn btn-primary">一覧</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
