<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>統計情報 - Sojo Bus Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        .chart-container {
            position: relative;
            height: 400px;
            margin-bottom: 20px;
        }
        .stats-card {
            transition: transform 0.2s;
        }
        .stats-card:hover {
            transform: translateY(-5px);
        }
        .realtime-indicator {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .table-responsive {
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/admin/">
                <i class="fas fa-arrow-left me-2"></i>Sojo Bus Admin
            </a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3">
                    <i class="fas fa-chart-bar"></i> 統計情報
                </span>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- サマリーカード -->
        <div class="row mb-4">
            <div class="col-md-3 mb-3">
                <div class="card stats-card bg-primary text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="card-title">総ユーザー数</h6>
                                <h3 id="total-users">-</h3>
                            </div>
                            <div class="align-self-center">
                                <i class="fas fa-users fa-2x"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card stats-card bg-success text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="card-title">アクティブユーザー</h6>
                                <h3 id="active-users">-</h3>
                            </div>
                            <div class="align-self-center">
                                <i class="fas fa-user-check fa-2x"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card stats-card bg-info text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="card-title">管理者</h6>
                                <h3 id="admin-users">-</h3>
                            </div>
                            <div class="align-self-center">
                                <i class="fas fa-user-shield fa-2x"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card stats-card bg-warning text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="card-title">
                                    リアルタイム接続
                                    <span class="realtime-indicator">●</span>
                                </h6>
                                <h3 id="active-connections">-</h3>
                            </div>
                            <div class="align-self-center">
                                <i class="fas fa-wifi fa-2x"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- グラフエリア -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">ユーザー登録トレンド（過去30日）</h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="userRegistrationChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- リアルタイムシステム監視 -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">システムリソース</h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container" style="height: 300px;">
                            <canvas id="systemResourceChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">リクエスト数</h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container" style="height: 300px;">
                            <canvas id="requestChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- データテーブル -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">日別ユーザー登録データ</h5>
                        <a href="/admin/statistics/export" class="btn btn-success btn-sm">
                            <i class="fas fa-download me-1"></i>CSV ダウンロード
                        </a>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover" id="statisticsTable">
                                <thead class="table-dark">
                                    <tr>
                                        <th>日付</th>
                                        <th>ユーザー登録数</th>
                                        <th>7日移動平均</th>
                                    </tr>
                                </thead>
                                <tbody id="statisticsTableBody">
                                    <tr>
                                        <td colspan="3" class="text-center">データを読み込み中...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // WebSocket接続
        const socket = io();
        
        // チャート変数
        let userRegistrationChart;
        let systemResourceChart;
        let requestChart;
        
        // リアルタイムデータ用変数
        let realtimeData = {
            timestamps: [],
            memoryUsage: [],
            cpuUsage: [],
            requestsPerMinute: []
        };
        
        // 初期データ読み込み
        async function loadStatisticsData() {
            try {
                const response = await fetch('/admin/statistics/data');
                const data = await response.json();
                
                if (data.error) {
                    console.error('Error loading statistics:', data.error);
                    return;
                }
                
                // サマリー更新
                document.getElementById('total-users').textContent = data.summary.total_users;
                document.getElementById('active-users').textContent = data.summary.active_users;
                document.getElementById('admin-users').textContent = data.summary.user_types.admin;
                
                // ユーザー登録チャート作成
                createUserRegistrationChart(data.chart_data);
                
                // テーブル更新
                updateStatisticsTable(data.daily_registrations, data.moving_average);
                
            } catch (error) {
                console.error('Failed to load statistics data:', error);
            }
        }
        
        // ユーザー登録チャート作成
        function createUserRegistrationChart(chartData) {
            const ctx = document.getElementById('userRegistrationChart').getContext('2d');
            
            if (userRegistrationChart) {
                userRegistrationChart.destroy();
            }
            
            userRegistrationChart = new Chart(ctx, {
                type: 'line',
                data: chartData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'ユーザー数'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: '日付'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        }
                    }
                }
            });
        }
        
        // システムリソースチャート作成
        function createSystemResourceChart() {
            const ctx = document.getElementById('systemResourceChart').getContext('2d');
            
            systemResourceChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: 'メモリ使用率 (%)',
                            data: [],
                            borderColor: 'rgb(255, 99, 132)',
                            backgroundColor: 'rgba(255, 99, 132, 0.2)',
                            tension: 0.1
                        },
                        {
                            label: 'CPU使用率 (%)',
                            data: [],
                            borderColor: 'rgb(54, 162, 235)',
                            backgroundColor: 'rgba(54, 162, 235, 0.2)',
                            tension: 0.1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            title: {
                                display: true,
                                text: '使用率 (%)'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        }
                    }
                }
            });
        }
        
        // リクエストチャート作成
        function createRequestChart() {
            const ctx = document.getElementById('requestChart').getContext('2d');
            
            requestChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'リクエスト/分',
                        data: [],
                        backgroundColor: 'rgba(75, 192, 192, 0.6)',
                        borderColor: 'rgba(75, 192, 192, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'リクエスト数'
                            }
                        }
                    }
                }
            });
        }
        
        // テーブル更新
        function updateStatisticsTable(dailyData, movingAvgData) {
            const tbody = document.getElementById('statisticsTableBody');
            tbody.innerHTML = '';
            
            // 移動平均データをマップに変換
            const movingAvgMap = {};
            if (movingAvgData) {
                movingAvgData.forEach(item => {
                    movingAvgMap[item.date] = item.moving_avg;
                });
            }
            
            dailyData.forEach(item => {
                const row = document.createElement('tr');
                const movingAvg = movingAvgMap[item.date];
                
                row.innerHTML = `
                    <td>${item.date}</td>
                    <td>${item.count}</td>
                    <td>${movingAvg ? movingAvg.toFixed(2) : '-'}</td>
                `;
                
                tbody.appendChild(row);
            });
        }
        
        // リアルタイムデータ更新
        function updateRealtimeData(data) {
            const now = new Date().toLocaleTimeString();
            
            // データ配列を更新（最新30個まで保持）
            realtimeData.timestamps.push(now);
            realtimeData.memoryUsage.push(data.memory_usage);
            realtimeData.cpuUsage.push(data.cpu_usage);
            realtimeData.requestsPerMinute.push(data.request_per_minute);
            
            if (realtimeData.timestamps.length > 30) {
                realtimeData.timestamps.shift();
                realtimeData.memoryUsage.shift();
                realtimeData.cpuUsage.shift();
                realtimeData.requestsPerMinute.shift();
            }
            
            // チャート更新
            if (systemResourceChart) {
                systemResourceChart.data.labels = [...realtimeData.timestamps];
                systemResourceChart.data.datasets[0].data = [...realtimeData.memoryUsage];
                systemResourceChart.data.datasets[1].data = [...realtimeData.cpuUsage];
                systemResourceChart.update('none');
            }
            
            if (requestChart) {
                requestChart.data.labels = [...realtimeData.timestamps];
                requestChart.data.datasets[0].data = [...realtimeData.requestsPerMinute];
                requestChart.update('none');
            }
            
            // 接続数更新
            document.getElementById('active-connections').textContent = data.active_connections;
        }
        
        // WebSocketイベントリスナー
        socket.on('connect', function() {
            console.log('WebSocket接続が確立されました');
            socket.emit('join_statistics');
        });
        
        socket.on('statistics_update', function(data) {
            updateRealtimeData(data);
        });
        
        socket.on('disconnect', function() {
            console.log('WebSocket接続が切断されました');
        });
        
        // リアルタイムデータ取得（フォールバック）
        async function fetchRealtimeData() {
            try {
                const response = await fetch('/admin/statistics/realtime-data');
                const data = await response.json();
                updateRealtimeData(data);
            } catch (error) {
                console.error('Failed to fetch realtime data:', error);
            }
        }
        
        // 初期化
        document.addEventListener('DOMContentLoaded', function() {
            loadStatisticsData();
            createSystemResourceChart();
            createRequestChart();
            
            // リアルタイムデータの定期取得（WebSocketが利用できない場合のフォールバック）
            setInterval(fetchRealtimeData, 5000);
        });
    </script>
</body>
</html>
