<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="10;url={{ url_for('top') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Sojo Bus</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bus-register.css') }}">
</head>
<body>
    <div class="container">
        <h1>Unten Bus Registration</h1>
        <div>
            <p>{{ bus_id }}号車</p>
            <p>出発時刻: {{ departure_time }}発</p>
            <p id="countdown">10秒で元のページに戻ります</p>
            <p>元のページは<a href="{{ url_for('top') }}">ここ</a>から</p>
        </div>
    </div>

    <script>
        var countdownElement = document.getElementById('countdown');
        var countdown = 10;

        function updateCountdown() {
            countdown--;
            countdownElement.textContent = countdown + '秒で元のページに戻ります';

            if (countdown <= 0) {
                clearInterval(timer);
            }
        }

        var timer = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
