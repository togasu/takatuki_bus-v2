<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="10;url={{ url_for('top') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sojo Bus</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f7f7;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            animation: fadein 1s;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        p {
            color: #555;
            margin-bottom: 10px;
        }

        a {
            color: #007bff;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #0056b3;
        }

        @keyframes fadein {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Unten Bus Registration</h1>
        <div>
            <p>{{ bus_id }}号車</p>
            <p>出発時刻: {{ departure_time }}発</p>
            <p id="countdown">10秒で元のページに戻ります</p>
            <p>元のページは<a href="{{ url_for('top') }}">ここ</a>から</p>
        </div>
    </div>

    <script>
        var countdownElement = document.getElementById('countdown');
        var countdown = 10;

        function updateCountdown() {
            countdown--;
            countdownElement.textContent = countdown + '秒で元のページに戻ります';

            if (countdown <= 0) {
                clearInterval(timer);
            }
        }

        var timer = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
