<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Login - Sojo Bus</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/top.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/bus.ico') }}">
    <style>
        body {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
            margin: 20px;
        }
        .login-header {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .login-header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        .login-header p {
            margin: 10px 0 0 0;
            font-size: 14px;
            opacity: 0.9;
        }
        .login-body {
            padding: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        .form-control:focus {
            outline: none;
            border-color: #2196F3;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.3);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            border-left: 4px solid #c62828;
        }
        .info-text {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🚌 Sojo Bus</h1>
            <p>ドライバー専用ログイン</p>
        </div>
        <div class="login-body">
            {% if message %}
            <div class="error-message">
                {{ message }}
            </div>
            {% endif %}
            
            <form method="POST" action="{{ url_for('main.login_register') }}" id="loginForm">
                <div class="form-group">
                    <label for="username">ユーザー名</label>
                    <input 
                        type="text" 
                        class="form-control" 
                        id="username" 
                        name="username" 
                        placeholder="driver1" 
                        required 
                        autofocus
                    >
                </div>
                
                <div class="form-group">
                    <label for="password">パスワード</label>
                    <input 
                        type="password" 
                        class="form-control" 
                        id="password" 
                        name="password" 
                        placeholder="パスワードを入力" 
                        required
                    >
                </div>
                
                <!-- デバイスMAC（開発/テスト用） -->
                <input type="hidden" name="device_mac" id="device_mac" value="">
                
                <button type="submit" class="btn-login">
                    ログイン
                </button>
            </form>
            
            <div class="info-text">
                ドライバー専用システムです<br>
                <small id="deviceInfo" style="color: #999;"></small>
            </div>
        </div>
    </div>
    
    <script>
        // デバイス情報を取得して送信する機能
        // ブラウザから直接MACアドレスは取得できないため、代替手段を使用
        
        // 方法1: localStorage からデバイスIDを取得（初回登録時に保存）
        function getStoredDeviceMac() {
            return localStorage.getItem('device_mac');
        }
        
        // 方法2: ブラウザフィンガープリントを生成（一意なデバイスIDの代替）
        async function generateDeviceFingerprint() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.textBaseline = 'top';
            ctx.font = '14px Arial';
            ctx.fillText('fingerprint', 2, 2);
            const canvasData = canvas.toDataURL();
            
            const data = {
                userAgent: navigator.userAgent,
                language: navigator.language,
                platform: navigator.platform,
                screenResolution: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                canvas: canvasData.substring(0, 50),
                vendor: navigator.vendor
            };
            
            const fingerprint = JSON.stringify(data);
            const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(fingerprint));
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            
            // MAC形式に変換（実際のMACアドレスではないが、一意なIDとして使用）
            return hashHex.substring(0, 12).match(/.{2}/g).join(':').toUpperCase();
        }
        
        // ページロード時にデバイス情報をセット
        window.addEventListener('DOMContentLoaded', async function() {
            let deviceMac = getStoredDeviceMac();
            
            if (!deviceMac) {
                // 保存されていない場合はフィンガープリントを生成
                deviceMac = await generateDeviceFingerprint();
                localStorage.setItem('device_mac', deviceMac);
            }
            
            // hidden フィールドにセット
            document.getElementById('device_mac').value = deviceMac;
            
            // デバイス情報を表示
            document.getElementById('deviceInfo').textContent = `デバイスID: ${deviceMac}`;
            
            console.log('Device MAC/ID:', deviceMac);
        });
        
        // フォーム送信時にヘッダーとしても送信
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const deviceMac = document.getElementById('device_mac').value;
            
            // Cookieにも保存
            document.cookie = `device_mac=${deviceMac}; path=/; max-age=31536000; SameSite=Strict`;
            
            console.log('Submitting login with device MAC:', deviceMac);
        });
        
        // 開発用: MACアドレス手動入力機能
        if (window.location.search.includes('debug=1')) {
            const manualMac = prompt('デバッグモード: MACアドレスを入力してください\n（例: AA:BB:CC:DD:EE:FF）');
            if (manualMac) {
                document.getElementById('device_mac').value = manualMac;
                localStorage.setItem('device_mac', manualMac);
                document.getElementById('deviceInfo').textContent = `デバイスID（手動設定）: ${manualMac}`;
            }
        }
    </script>
