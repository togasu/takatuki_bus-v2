<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Dashboard - Sojo Bus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-brand {
            font-weight: bold;
        }
        .dashboard-card {
            transition: transform 0.2s;
        }
        .dashboard-card:hover {
            transform: translateY(-5px);
        }
        .status-badge {
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Sojo Bus Driver</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/driver/logout">ログアウト</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-4">ドライバー ダッシュボード</h1>
                <p class="text-muted">ようこそ、ドライバーさん</p>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <h5 class="card-title">運行状況</h5>
                        <p class="card-text">現在の運行状況と路線情報</p>
                        <span class="badge bg-success status-badge">運行中</span>
                        <div class="mt-2">
                            <a href="/api/routes" class="btn btn-success">確認</a>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4 mb-4">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <h5 class="card-title">バス管理</h5>
                        <p class="card-text">担当バスの状態と車両情報</p>
                        <a href="/api/vehicles" class="btn btn-success">管理</a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4 mb-4">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <h5 class="card-title">運行記録</h5>
                        <p class="card-text">運行履歴と実績の確認</p>
                        <a href="/api/logs" class="btn btn-success">確認</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <h5 class="card-title">緊急連絡</h5>
                        <p class="card-text">緊急時の連絡先と手順</p>
                        <a href="/emergency" class="btn btn-warning">確認</a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6 mb-4">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <h5 class="card-title">お知らせ</h5>
                        <p class="card-text">重要なお知らせと連絡事項</p>
                        <a href="/notices" class="btn btn-info">確認</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <div class="alert alert-success">
                    <h5 class="alert-heading">運行情報</h5>
                    <p>現在のサーバー時刻: <span id="current-time"></span></p>
                    <p class="mb-0">ドライバー権限でログイン中です。安全運転でお願いします。</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function updateTime() {
            document.getElementById('current-time').textContent = new Date().toLocaleString('ja-JP');
        }
        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
