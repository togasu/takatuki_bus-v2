<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self';">
		<title>Sojo Bus Login</title>
		<link rel="stylesheet" href="{{ url_for('static', filename='css/top.css') }}">
		<link rel="stylesheet" href="{{ url_for('static', filename='css/header_footer.css')}}">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
		<style>
			h1 {
    			margin-top: 10px;
    			margin-bottom: 10px;
    			font-size: 25px;
			}
			h2 {
    			color: white;
			}
		</style>
	</head>
	<body>
		<header class="header">
			<div class="header-content">
				<a href="#" class="header-title">Sojo Bus</a>
			</div>
		</header>			<form class="box" action="{{ url_for('auth.login') }}" method="post">
				<h1>Login</h1>
				{% if message %}
				<div class="alert alert-warning" role="alert" style="margin-bottom: 15px; padding: 10px; background-color: #fff3cd; border: 1px solid #ffeaa7; border-radius: 4px; color: #856404;">
					{{ message | e }}
				</div>
				{% endif %}
				<input type="text" name="username" placeholder="Username" required>
				<input type="password" name="password" placeholder="Password" required>
				<input type="submit" name="" value="Login">
			</form>

			<footer class="footer">
    		<div id="line"></div>
				<div style="margin-top: 10px; font-size: 14px;">
					<span>©Versear</span>
					<span style="margin-left: 20px;">|</span>
					<a href="#" style="color: #ffffff; margin-left: 20px; text-decoration: none;">Release Notes</a>
				</div>
			</footer>

	</body>
</html>
