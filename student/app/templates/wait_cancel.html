<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{url_for('static',filename='css/header_footer.css')}}">
	  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}">
    <title>yayaku_system_defalt</title>
    <script>
    // data-url属性を使用して適切にリダイレクトする
    document.addEventListener('DOMContentLoaded', function() {
      const redirectBtns = document.querySelectorAll('.redirect-btn');
      redirectBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          const url = this.getAttribute('data-url');
          if (url) {
            window.location.href = url;
          }
        });
      });
    });
    </script>
  </head>

  <body>
    <header class="header">
      <p><a href="{{url_for('main.personal')}}">Sojo Bus</a></p>
    </header>
    <main>

    <div class="container">
      <h5 class="alert alert-warning">キャンセル席が発生しましたので、申し込みますか？</h5>
      <div class="d-flex flex-column">
        <button type="submit" class="btn btn-danger btn-mg redirect-btn" data-url="{{ url_for('booking.seat', bus_id=bnum) }}">申込む</button>
        <button type="submit" class="btn btn-secondary btn-mg redirect-btn" data-url="{{ url_for('booking.choice') }}">戻る</button>
      </div>
    </div>
    </main>
    <footer class="footer">
      <div id="line"></div>
    </footer>
  </body>
</html>
