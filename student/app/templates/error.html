<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self';">
  <title>error</title>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: 'Courier New', monospace;
      background-color: #1e1e1e;
      color: #ffffff;
    }

    .terminal-container {
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
      background-color: #2c2c2c;
    }

    .error-message {
      justify-content: center;
      font-size: 18px;
      color: #ff5370;
      margin-bottom: 10px;
    }

    .back-home-link {
      text-decoration: none;
      font-size: 14px;
      color:#82aaff;
      padding: 8px 12px;
      border: 1px solid #82aaff;
      border-radius: 4px;
      transition: background-color 0.3s, color 0.3s;
    }

    .back-home-link:hover {
      background-color: #82aaff;
      color: #1e1e1e;
    }
  </style>
</head>
<body>

  <div class="terminal-container">
    <p class="error-message">Error: Command not found</p>
    <p> {{ error_message | e }} </p>
	  <a href="{{ url_for('main.personal') }}"><button type="submit" class="back-home-link">戻る</button>
  </div>

</body>
</html>
